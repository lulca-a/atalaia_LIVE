name: Atualizar disponibilidades dos radares

on:
  schedule:
    - cron: "17 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar-disponibilidades:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v5

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: python -m pip install requests python-dotenv

      - name: Consultar radares e atualizar os JSONs
        env:
          API_KEY_1: ${{ secrets.API_KEY_1 }}
        run: |
          echo "Branch: $GITHUB_REF_NAME"
          echo "Evento: $GITHUB_EVENT_NAME"
          python consulta/main.py

      - name: Diagnosticar e salvar JSONs
        run: |
          echo "Arquivos JSON:"
          find banco -type f -name "*.json"

          echo "Estado do Git:"
          git status --short

          git add -A banco/

          echo "Alterações preparadas:"
          git diff --cached --stat

          if git diff --cached --quiet; then
            echo "Nenhuma alteração nos JSONs."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Atualizar disponibilidades dos radares"
            git push
          fi
